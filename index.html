<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>ซับไว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Prompt:wght@500;700;800&family=Mitr:wght@500;600&family=Sarabun:wght@500;700;800&family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Bai+Jamjuree:wght@500;700&family=K2D:wght@500;700;800&family=Krub:wght@500;700&family=Athiti:wght@500;700&family=Niramit:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Sriracha&family=Mali:wght@500;700&family=Pattaya&family=Chonburi&family=Kodchasan:wght@500;700&family=Fahkwang:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Charmonman:wght@400;700&family=Srisakdi:wght@400;700&family=Pridi:wght@500;700&family=Trirong:wght@500;700;800&family=Taviraj:wght@500;700;800&family=Noto+Serif+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column of projects; editor = sticky video stage + tabbed side panel on wide screens */
:root{
  --bg:#0D1117; --surface:#151B24; --raise:#1C2430; --line:#2A3341;
  --fg:#E8ECF2; --muted:#8B95A6;
  --accent:#F4C430; --on-accent:#1B1503; --accent-text:#F4C430;
  --danger:#F0605A; --ok:#43C08A;
  --ui:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#F3F5F8; --surface:#FFFFFF; --raise:#ECEFF4; --line:#D9DEE6; --fg:#121821; --muted:#5A6473; --accent-text:#866200; --danger:#C93A34; --ok:#1F8A5B; color-scheme:light }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--ui);margin:0;text-wrap:balance;line-height:1.25}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.bar{display:flex;align-items:center;gap:12px;padding-block:14px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--ui);font-weight:700;font-size:20px;letter-spacing:.2px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.brand .mark{background:var(--accent);color:var(--on-accent);font-size:13px;padding:3px 7px;border-radius:4px;line-height:1.2}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--ui);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{display:grid;gap:6px}
.field>label,.lab{font-family:var(--ui);font-weight:600;font-size:14px}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.input{min-height:72px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}

.home-head{display:flex;flex-wrap:wrap;align-items:end;gap:12px;justify-content:space-between;margin-bottom:18px}
.home-head h1{font-size:30px}
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,var(--surface));margin-bottom:18px}
.notice p{margin:0;flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pcard{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;padding:0}
.pcard:hover{border-color:var(--muted)}
.thumb{aspect-ratio:16/10;background:var(--raise);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:2px 6px;border-radius:4px}
.pcard .meta{padding:12px 14px;display:grid;gap:4px;min-width:0}
.pcard .meta b{font-family:var(--ui);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty .sample{font-family:"Kanit",var(--ui);font-weight:700;font-size:22px;color:#fff;background:#000;padding:6px 14px;border-radius:6px;line-height:1.35}
.empty .sample small{display:block;font-size:15px;color:#FFE14D;font-weight:500}

.np{max-width:640px;display:grid;gap:20px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-family:var(--ui);display:inline-flex;gap:6px;align-items:center;justify-self:start}
.np h1{font-size:30px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 18px;text-align:center;display:grid;gap:10px;justify-items:center;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--accent)}
.drop .up{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.fileinfo{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.fileinfo img{width:80px;height:56px;object-fit:cover;border-radius:6px;background:var(--raise)}
.fileinfo div{min-width:0;flex:1}
.fileinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:42px;border:0;background:none;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.steps{list-style:none;margin:0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:center}
.steps .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.doing .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done .dot{background:var(--ok);border-color:var(--ok)}
.steps li.fail .dot{background:var(--danger);border-color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--danger);font-size:14px;white-space:pre-wrap}

.ed-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ed-top .name{flex:1;min-width:180px;font-family:var(--ui);font-weight:700;font-size:20px;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px}
.ed-top .name:hover,.ed-top .name:focus{border-color:var(--line);background:var(--surface)}
.saved{font-size:12px;color:var(--muted)}
.ed-grid{display:grid;gap:18px}
@media (min-width:900px){ .ed-grid{grid-template-columns:minmax(0,1fr) minmax(0,460px);align-items:start} .stage-col{position:sticky;top:84px} }
.stage-col{display:grid;gap:10px;justify-items:center;min-width:0}
@media (max-width:899px){ .stage-col{position:sticky;top:69px;z-index:4;background:var(--bg);padding-block:6px 10px;border-bottom:1px solid var(--line)} }
.qe{width:100%;max-width:640px;display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px}
.qe-bar{display:flex;align-items:center;gap:6px}
.qe-bar .mono{margin-left:auto;margin-right:auto;font-size:12.5px}
.qbtn{min-width:40px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px;padding:0 10px}
.qbtn.play{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.qe textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:none;padding:6px 8px;font-family:var(--ui);font-size:16px;line-height:1.4}
.qe textarea.tr{font-size:14.5px;color:var(--accent-text)}
.qe-acts{display:flex;flex-wrap:wrap;gap:2px}
.npprev{display:block;margin:0 auto;border-radius:10px;background:#3A4150;max-width:100%;max-height:46vh}
.np-looks{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:104px;overflow-x:auto;padding-bottom:4px}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;max-width:100%}
.stage video{display:block;width:100%;height:100%;object-fit:contain}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.missing{display:grid;gap:10px;justify-items:center;padding:30px 16px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);width:100%}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:48px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--ui);font-weight:600;color:var(--muted);font-size:14px;padding:0 4px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:14px;display:grid;gap:14px}
.tools{display:grid;gap:10px}
details.box{border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.box summary{min-height:42px;display:flex;align-items:center;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px}
details.box .in{display:grid;gap:8px;padding-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.input{flex:1;min-width:120px}
.caps{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
@media (max-width:899px){.caps{max-height:none}}
.cap{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:4px;background:var(--bg)}
.cap.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cap-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc{border:0;background:var(--raise);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12.5px}
.cap textarea{width:100%;border:0;background:none;resize:none;padding:2px 0;min-height:28px;font-family:var(--ui);font-size:16px;line-height:1.45;overflow:hidden}
.cap textarea.tr{font-size:14.5px;color:var(--accent-text);border-top:1px dashed var(--line);padding-top:5px}
.cap textarea:focus{outline:none}
.cap-acts{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.mini{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 6px;border-radius:6px;cursor:pointer;font-family:var(--ui)}
.mini:hover{background:var(--raise);color:var(--fg)}
.mini.del:hover{color:var(--danger)}
.times{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.times input,.sfxrow input.t{width:96px;min-height:34px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:13px}
.sfxtag{font-size:11.5px;background:var(--raise);border-radius:99px;padding:1px 8px;color:var(--muted)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;min-height:42px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px;color:var(--muted)}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.badge{font-size:11px;background:var(--raise);color:var(--fg);border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:600}
.lookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.look{display:grid;gap:4px;padding:5px 5px 7px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;text-align:center;font-family:var(--ui);font-weight:600;font-size:12.5px;min-width:0}
.look canvas{width:100%;aspect-ratio:8/5;border-radius:8px;display:block;background:#3A4150}
.look span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.mycard{display:grid;gap:2px;min-width:0}
.mycard .mini{justify-self:center}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.fontbtn{display:grid;gap:2px;justify-items:center;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;min-width:0}
.fontbtn b{font-size:20px;line-height:1.35;font-weight:inherit}
.fontbtn span{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fontbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.fx{display:grid;gap:4px;padding:4px 4px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:center;font-family:var(--ui);font-weight:600;font-size:12.5px}
.fx canvas{width:100%;aspect-ratio:16/9;border-radius:6px;display:block;background:#222831}
.fx[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.preset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px;min-height:40px}
.ctl{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center}
.ctl label{font-size:14px;font-family:var(--ui);font-weight:600}
.ctl output{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:40px;text-align:right}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.result video{width:100%;max-height:50vh;border-radius:10px;background:#000}
.divider{height:1px;background:var(--line)}
.sub-h{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.4px;color:var(--muted)}

/* sound effects */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.chip{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg);min-width:0}
.chip button{border:0;background:none;cursor:pointer;min-height:40px}
.chip .pl{width:36px;flex:none;border-right:1px solid var(--line);color:var(--muted)}
.chip .pl:hover{color:var(--fg);background:var(--raise)}
.chip .ad{flex:1;text-align:left;padding:0 10px;font-family:var(--ui);font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ad:hover{background:var(--raise)}
.chip.mine .ad{color:var(--accent-text)}
.sfxlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sfxrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg)}
.sfxrow .nm{font-family:var(--ui);font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfxrow .vol{grid-column:1 / -1;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.sfxrow .vol input{flex:1;accent-color:var(--accent)}
.nowpos{font-family:var(--mono);font-size:13px;background:var(--raise);border-radius:6px;padding:2px 8px}

.modal{position:fixed;inset:0;background:rgba(5,8,12,.6);display:grid;place-items:end center;z-index:20;padding:16px}
@media (min-width:640px){.modal{place-items:center}}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px}
.sheet h2{font-size:20px}
.sheet ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-family:var(--ui);font-weight:600;font-size:14px;z-index:30;max-width:90vw}
/* editor v3 */
.ed-head{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.ed-head .name{flex:1;min-width:0;font-family:var(--ui);font-weight:700;font-size:18px;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px}
.ed-head .name:hover,.ed-head .name:focus{border-color:var(--line);background:var(--surface)}
.iconbtn{font-size:18px;color:var(--fg)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.player{width:100%;display:grid;gap:8px;justify-items:center}
.screen{position:relative;background:#000;border-radius:10px;overflow:hidden;max-width:100%}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;background:transparent}
.screen .bgcv{inset:-10%;width:120%;height:120%;filter:blur(14px) brightness(.7);pointer-events:none;touch-action:auto}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;display:block}
.fs-close{display:none}
.pctl{display:flex;align-items:center;gap:8px;width:100%;max-width:640px}
.pctl input[type=range]{flex:1;min-width:40px;accent-color:var(--accent)}
.pbtn{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-size:16px;display:grid;place-items:center}
.pbtn.play{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ptime{font-size:12px;color:var(--muted);white-space:nowrap}
.player.fs{position:fixed;inset:0;z-index:60;background:#000;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.player.fs .screen{border-radius:0}
.player.fs .pctl{max-width:720px}
.player.fs .pbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}
.player.fs .pbtn.play{background:var(--accent);color:var(--on-accent)}
.player.fs .ptime{color:#ddd}

<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n, l = 2) => String(n).padStart(l, "0");
function fmtT(t) { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return pad(m) + ":" + s.toFixed(1).padStart(4, "0"); }

}

const safeName = s => (s || "video").replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 60) || "video";

/* ================= languages ================= */
const LANGS = [
  ["th", "ไทย", "Thai"], ["en", "อังกฤษ", "English"], ["zh", "จีน", "Simplified Chinese"], ["ja", "ญี่ปุ่น", "Japanese"],
  ["ko", "เกาหลี", "Korean"], ["lo", "ลาว", "Lao"], ["my", "พม่า", "Burmese"], ["km", "กัมพูชา", "Khmer"],
  ["vi", "เวียดนาม", "Vietnamese"], ["ms", "มาเลย์", "Malay"], ["id", "อินโดนีเซีย", "Indonesian"], ["hi", "ฮินดี", "Hindi"],
  ["fr", "ฝรั่งเศส", "French"], ["de", "เยอรมัน", "German"], ["es", "สเปน", "Spanish"], ["ru", "รัสเซีย", "Russian"]

const LEN = Object.fromEntries(LANGS.map(l => [l[0], l[2]]));
const langOptions = (sel, extra = "") => extra + LANGS.map(([v, n]) => `<option value="${v}"${v === sel ? " selected" : ""}>${n}</option>`).join("");

/* ================= settings ================= */
const SKEY = "subwai.settings.v1";
const DEFAULT_STYLE = { font: "Kanit", weight: 700, size: 64, pos: 80, color: "#FFFFFF", strokeColor: "#000000", stroke: 5, box: false, boxColor: "#000000", boxOpacity: 0.7, shadow: true, size2: 72, color2: "#FFE14D", order: "below", anim: "none", hl: "#FFD400", glow: "", dshadow: "", look: "", kw: true, kwColor: "#FFE14D", posX: 50 };
const settings = Object.assign({ provider: "", groqKey: "", apiKey: "", lang: "th", lang2: "", vocab: "", maxChars: 22, chatModel: "", style: { ...DEFAULT_STYLE } }, (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch { return {}; } })());

/* ================= IndexedDB ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("subwai", 3);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains("projects")) d.createObjectStore("projects", { keyPath: "id" });
        if (!d.objectStoreNames.contains("videos")) d.createObjectStore("videos");
        if (!d.objectStoreNames.contains("sfx")) d.createObjectStore("sfx", { keyPath: "id" });

      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  st(name, mode) { return this.db.transaction(name, mode).objectStore(name); },
  q(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  all() { return this.q(this.st("projects", "readonly").getAll()); },
  get(id) { return this.q(this.st("projects", "readonly").get(id)); },
  put(p) { return this.q(this.st("projects", "readwrite").put(p)); },
  putVideo(id, b) { return this.q(this.st("videos", "readwrite").put(b, id)); },
  getVideo(id) { return this.q(this.st("videos", "readonly").get(id)); },
  async del(id) { await this.q(this.st("projects", "readwrite").delete(id)); await this.q(this.st("videos", "readwrite").delete(id)); },
  sfxAll() { return this.q(this.st("sfx", "readonly").getAll()); },
  sfxPut(x) { return this.q(this.st("sfx", "readwrite").put(x)); },
  sfxDel(id) { return this.q(this.st("sfx", "readwrite").delete(id)); },
  mediaPut(x) { return this.q(this.st("media", "readwrite").put(x)); },
  mediaGet(id) { return this.q(this.st("media", "readonly").get(id)); },
  mediaDel(id) { return this.q(this.st("media", "readwrite").delete(id)); }
};
function normalize(p) {
  p.style = { ...DEFAULT_STYLE, ...(p.style || {}) };
  p.tr = p.tr || { lang: "", mode: "main" };
  p.sfx = p.sfx || [];
  p.audio = p.audio || { orig: 1, sfx: 0.9 };
  p.lang = p.lang || "th";
  p.layout = p.layout || "orig";
  p.fit = p.fit || "blur";

}

/* ================= text tools ================= */
const segCache = {};
function seg(lang) {
  if (typeof Intl === "undefined" || !Intl.Segmenter) return null;
  const l = (!lang || lang === "auto") ? "th" : lang;
  return segCache[l] || (segCache[l] = new Intl.Segmenter(l, { granularity: "word" }));
}
const tokens = (s, lang) => { const S = seg(lang); return S ? [...S.segment(s)].map(x => x.segment) : s.split(/(\s+)/).filter(Boolean); };
const vlen = s => s.replace(/[\sัิ-ฺ็-๎]/g, "").length;
const isLatin = c => /[A-Za-z0-9À-ɏЀ-ӿ]/.test(c || "");
function joinTok(a, b) { if (!a) return b; if (!b) return a; return (isLatin(a.slice(-1)) || isLatin(b[0])) ? a + " " + b : a + b; }

  for (const s of S.segment(text)) { if (s.index === idx) return true; if (s.index > idx) return false; }
  return false;
}
function fromWords(words, maxChars, lang) {
  const out = []; let cur = null;
  const push = () => { if (cur && cur.text.trim()) out.push({ start: cur.start, end: cur.end, text: cur.text.trim() }); cur = null; };
  for (const w of words) {
    const t = String(w.word || "").trim(); if (!t) continue;
    if (!cur) { cur = { start: w.start, end: w.end, text: t }; continue; }
    const next = joinTok(cur.text, t);
    const gap = w.start - cur.end;
    const over = vlen(next) > maxChars;
    const boundary = isBoundary(next, next.length - t.length, lang);
    const brk = gap > 0.6 || /[.?!…。？！]$/.test(cur.text) || (over && boundary) || vlen(next) > maxChars + 8 || (w.end - cur.start) > 6;
    if (brk) { push(); cur = { start: w.start, end: w.end, text: t }; }
    else { cur.text = next; cur.end = w.end; }
  }

}
function fromSegments(segs, maxChars, lang) {
  const out = [];

    const text = String(s.text || "").trim(); if (!text) continue;
    if (vlen(text) <= maxChars) { out.push({ start: s.start, end: s.end, text }); continue; }

      else g += tk;
    }
    if (g.trim()) groups.push(g.trim());
    const total = groups.reduce((a, x) => a + Math.max(1, vlen(x)), 0);
    let t = s.start;
    for (const x of groups) { const d = (s.end - s.start) * Math.max(1, vlen(x)) / total; out.push({ start: t, end: t + d, text: x }); t += d; }

/* ================= AI providers ================= */

const PROVIDERS = {
  groq: { n: "Groq", tag: "ฟรี", base: "https://api.groq.com/openai/v1", stt: "whisper-large-v3", chat: ["openai/gpt-oss-120b", "llama-3.3-70b-versatile", "openai/gpt-oss-20b"], keyField: "groqKey", ph: "gsk_..." },
  openai: { n: "OpenAI", tag: "เสียเงิน", base: "https://api.openai.com/v1", stt: "whisper-1", chat: ["gpt-4.1-mini", "gpt-4o-mini", "gpt-5-mini"], keyField: "apiKey", ph: "sk-..." }
};
const prov = () => PROVIDERS[settings.provider] || PROVIDERS.groq;
const curKey = () => (settings[prov().keyField] || "").trim();
const hasKey = () => !!curKey();
function apiError(status, j) {

async function aiProofread(p, onProg) {
  const B = 40, L = LEN[p.lang] || "the spoken language";
  const vocab = settings.vocab ? ` Names that may appear, spelled correctly: ${settings.vocab}.` : "";
  let changedN = 0;
  for (let i = 0; i < p.captions.length; i += B) {
    const batch = p.captions.slice(i, i + B);
    const j = await chatJSON([
      { role: "system", content: `You proofread automatic speech-to-text subtitles in ${L}. Fix only real transcription errors: misheard or misspelled words, wrong tone marks or vowels, words wrongly split or joined, and misspelled names or brands.${vocab} Use the neighbouring lines as context. Do not rephrase, summarise, translate, censor, or change the speaker's wording or slang. If a line is already correct, return it unchanged. Keep exactly the same number of lines in the same order. Reply only with JSON: {"t": ["line 1", "line 2"]}` },
      { role: "user", content: JSON.stringify({ previous_lines: p.captions.slice(Math.max(0, i - 3), i).map(c => c.text), lines: batch.map(c => c.text) }) }
    ]);
    if (Array.isArray(j.t) && j.t.length === batch.length) batch.forEach((c, k) => {
      const n = String(j.t[k] || "").trim(), a = vlen(c.text), b = vlen(n);
      if (n && n !== c.text && b >= a * 0.5 && b <= a * 1.8 + 4) { c.text = n; c.hl = (c.hl || []).filter(w => n.includes(w)); changedN++; }
    });
    if (onProg) onProg(Math.min(p.captions.length, i + B), p.captions.length);
  }
  return changedN;
}
async function aiKeywords(p) {
  const B = 60; let n = 0;
  for (let i = 0; i < p.captions.length; i += B) {
    const batch = p.captions.slice(i, i + B);
    const j = await chatJSON([
      { role: "system", content: "You pick words to emphasise in short-video subtitles, like the coloured words in viral captions. For about half of the lines, choose the single most important word or short phrase: a number, price, product or brand name, key benefit, or strong emotion. Copy it exactly as it appears in the line, character for character. Skip lines with nothing worth emphasising. Reply only with JSON: {\"items\":[{\"i\": line_index, \"w\": \"exact text\"}]}" },
      { role: "user", content: JSON.stringify({ lines: batch.map((c, k) => ({ i: k, text: c.text })) }) }

const tempVideos = {};
async function probeVideo(f) {
  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto";
  const url = URL.createObjectURL(f); v.src = url;
  try {
    await Promise.race([once(v, "loadedmetadata"), sleep(15000).then(() => { throw new Error("timeout"); })]);
    const out = { duration: v.duration, width: v.videoWidth, height: v.videoHeight, thumb: "" };
    try {
      v.currentTime = Math.min(1, v.duration / 3);
      await Promise.race([once(v, "seeked"), sleep(5000)]);
      const c = document.createElement("canvas"), k = 360 / Math.max(v.videoWidth, v.videoHeight);
      c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      out.thumb = c.toDataURL("image/jpeg", 0.7);
    } catch {}
    return out;
  } finally { URL.revokeObjectURL(url); v.removeAttribute("src"); }
}

    else if (a === "del") {
      if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "แตะอีกครั้งเพื่อลบ"; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = "ลบฉาก"; } }, 3000); return; }
      const list = p.split.scenes, i = list.indexOf(sc); list.splice(i, 1);
      if (list[i - 1]) list[i - 1].end = sc.end; else if (list[i]) list[i].start = sc.start;
      changed(); renderScenes();
    }
  });
  $("#scenes").addEventListener("change", e => { const inp = e.target.closest('input[data-s="file"]'); if (!inp) return; const sc = scOf(inp), f = inp.files[0]; inp.value = ""; attachMedia(sc, f); });
  const onSceneEdit = e => {
    const el = e.target.closest("[data-k]"); if (!el) return; const sc = scOf(el); if (!sc) return;
    const k = el.dataset.k; sc[k] = k === "items" ? el.value.split("\n").map(x => x.trim()).filter(Boolean) : el.value;
    const c = $(".scn-th", el.closest(".scn")); try { drawScene(c.getContext("2d"), 0, 0, c.width, c.height, sc, 1.8, null); } catch {}
    if (video && (video.currentTime < sc.start || video.currentTime >= sc.end)) seekTo(sc.start);
    changed({ typing: true });
  };
  $("#scenes").addEventListener("input", onSceneEdit);
  $("#scenes").addEventListener("change", e => { if (e.target.matches("select[data-k]")) onSceneEdit(e); });

  /* ---------- frame ---------- */
  function syncFrame() {
    const vr = p.width && p.height ? p.width / p.height : 9 / 16;
    $("#ratios").innerHTML = Object.entries(LAYOUTS).map(([k, L]) => { const r = L.r || vr, w = r >= 1 ? 30 : Math.round(30 * r), h = r >= 1 ? Math.round(30 / r) : 30; return `<button type="button" class="ratio" data-v="${k}" aria-pressed="${p.layout === k}"><i style="width:${w}px;height:${h}px"></i>${L.n}</button>`; }).join("");
    $$("#fitSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === p.fit));
    $("#fitSeg").hidden = p.layout === "orig";
    $("#frameNote").hidden = !p.split.on; $("#ratios").style.opacity = p.split.on ? ".4" : ""; $("#ratios").style.pointerEvents = p.split.on ? "none" : "";
  }
  $("#ratios").addEventListener("click", e => { const b = e.target.closest(".ratio"); if (!b) return; p.layout = b.dataset.v; syncFrame(); changed(); sizeStage(); });
  $$("#fitSeg button").forEach(b => b.onclick = () => { p.fit = b.dataset.v; syncFrame(); changed(); });

  /* ---------- export ---------- */
  function syncExportHint() { const { W, H } = frameDims(p, video && video.videoWidth, video && video.videoHeight); $("#exHint").textContent = `ขนาด ${W}×${H} · ใช้เวลาประมาณเท่าความยาวคลิป (${fmtDur(p.duration)}) เปิดหน้าจอค้างไว้จนเสร็จ ห้ามสลับแอป`; }
  $("#srt").onclick = () => {
    const mode = $("#srtMode").value;
    const ts = t => { const ms = Math.round(t * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60; return `${pad(h)}:${pad(m)}:${pad(s)},${pad(ms % 1000, 3)}`; };
    const body = c => mode === "tr" ? (c.tr || "").trim() : mode === "both" ? [c.text.trim(), (c.tr || "").trim()].filter(Boolean).join("\n") : c.text.trim();
    const txt = p.captions.filter(c => body(c)).map((c, i) => `${i + 1}\n${ts(c.start)} --> ${ts(c.end)}\n${body(c)}\n`).join("\n");
    const suffix = mode === "tr" ? "_" + p.tr.lang : mode === "both" ? "_" + p.lang + "-" + p.tr.lang : "";
    downloadBlob(new Blob(["﻿" + txt], { type: "application/x-subrip" }), safeName(p.name) + suffix + ".srt");
  };
  const mime = pickMime();
  if (mime === null || !HTMLCanvasElement.prototype.captureStream) { $("#burn").disabled = true; $("#exHint").textContent = "เบราว์เซอร์นี้สร้างวิดีโอไม่ได้ ลองเปิดใน Chrome หรือ Safari รุ่นใหม่"; }
  $("#burn").onclick = () => {
    if (!blob) { toast("ต้องเลือกไฟล์วิดีโอก่อน"); return; }
    if (video) video.pause();
    const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC();
    const v = document.createElement("video"); v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto";
    v.style.cssText = "position:fixed;left:-10px;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
    document.body.appendChild(v);
    const vurl = URL.createObjectURL(blob); v.src = vurl;
    const unlock = v.play().then(() => v.pause()).catch(() => {});
    ac.resume().catch(() => {});
    runExport(ac, v, vurl, unlock);
  };
  async function runExport(ac, v, vurl, unlock) {
    const job = { cancel: false }; exporting = job;
    $("#burn").disabled = true; $("#exProg").hidden = false; $("#exRes").hidden = true; $("#exBar").style.width = "0%"; $("#exTxt").textContent = "กำลังเตรียม…";
    let wake = null; try { wake = await navigator.wakeLock.request("screen"); } catch {}
    const srcs = [], exMedia = {};
    const finish = () => { freeMedia(exMedia); srcs.forEach(s => { try { s.stop(); } catch {} }); try { v.pause(); } catch {} try { ac.close(); } catch {} v.remove(); URL.revokeObjectURL(vurl); try { wake && wake.release(); } catch {} exporting = null; $("#burn").disabled = false; $("#exProg").hidden = true; };
    try {
      await unlock;
      if (v.readyState < 1) await once(v, "loadedmetadata");
      await ensureFont(p.style);
      const bufs = {};
      for (const s of p.sfx) if (!bufs[s.key]) bufs[s.key] = await getSfxBuffer(s.key);
      const { W, H } = frameDims(p, v.videoWidth, v.videoHeight);
      const c = document.createElement("canvas"); c.width = W; c.height = H; const ctx = c.getContext("2d");
      const dest = ac.createMediaStreamDestination();
      const src = ac.createMediaElementSource(v), og = ac.createGain(); og.gain.value = p.audio.orig; src.connect(og).connect(dest);
      const sfxBus = ac.createGain(); sfxBus.gain.value = p.audio.sfx; sfxBus.connect(dest);
      const stream = c.captureStream(30); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      const opts = { videoBitsPerSecond: Math.min(12e6, Math.max(4e6, W * H * 4)), audioBitsPerSecond: 160000 }; if (mime) opts.mimeType = mime;
      const rec = new MediaRecorder(stream, opts); const parts = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
      const stopped = new Promise(r => rec.onstop = r);
      v.currentTime = 0; if (v.seeking) await once(v, "seeked");
      await loadMediaEls(p, exMedia);
      const frame = () => renderFrame(ctx, W, H, v, p, v.currentTime, (sc, t) => mediaFor(exMedia, sc, t, true));
      const done = new Set();
      const schedule = () => {
        const now = v.currentTime;
        for (const s of p.sfx) {
          if (done.has(s.id) || !bufs[s.key]) continue;
          if (s.t < now - 0.05) { done.add(s.id); continue; }
          if (s.t < now + 0.3) { done.add(s.id); const bs = ac.createBufferSource(); bs.buffer = bufs[s.key]; const g = ac.createGain(); g.gain.value = s.vol; bs.connect(g).connect(sfxBus); bs.start(ac.currentTime + Math.max(0, s.t - now)); srcs.push(bs); }
        }
      };
      frame(); rec.start(1000); await ac.resume(); await v.play();
      let rafE = 0;
      const tick = () => { frame(); schedule(); const pct = Math.min(100, v.currentTime / v.duration * 100); $("#exBar").style.width = pct + "%"; $("#exTxt").textContent = `${pct.toFixed(0)}% · ${fmtDur(v.currentTime)} / ${fmtDur(v.duration)}`; if (!v.ended && !job.cancel) rafE = requestAnimationFrame(tick); };
      tick();
      const onHide = () => { if (document.hidden) toast("อย่าสลับแอประหว่างสร้างวิดีโอ วิดีโออาจกระตุก", 4000); };
      document.addEventListener("visibilitychange", onHide);
      await new Promise(r => { v.onended = r; job.done = r; });
      document.removeEventListener("visibilitychange", onHide);
      cancelAnimationFrame(rafE); frame();
      const tail = p.sfx.filter(s => bufs[s.key]).reduce((m, s) => Math.max(m, s.t + bufs[s.key].duration - v.duration), 0);
      await sleep(200 + Math.min(2500, Math.max(0, tail) * 1000));
      rec.stop(); await stopped;
      if (job.cancel) { finish(); toast("ยกเลิกแล้ว"); return; }
      const type = (rec.mimeType || mime || "video/webm").split(";")[0];
      const out = new Blob(parts, { type }), ext = type.includes("mp4") ? "mp4" : "webm", name = safeName(p.name) + "_ซับ." + ext;
      finish();
      const res = $("#exRes"); res.hidden = false;
      res.innerHTML = `<video controls playsinline src="${URL.createObjectURL(out)}"></video><span class="hint">${esc(name)} · ${fmtSize(out.size)}${ext === "webm" ? " · ไฟล์ .webm ถ้าแอปไหนไม่รองรับ ลองสร้างจาก Safari จะได้ .mp4" : ""}</span><div class="row"><button class="btn primary" id="oShare">บันทึกลงเครื่อง / แชร์</button><button class="btn" id="oDl">ดาวน์โหลดไฟล์</button></div>`;
      $("#oShare").onclick = () => shareOrSave(out, name);
      $("#oDl").onclick = () => downloadBlob(out, name);
    } catch (e) {
      finish();
      const res = $("#exRes"); res.hidden = false; res.innerHTML = `<div class="err">สร้างวิดีโอไม่สำเร็จ: ${esc(e.message || e)}</div>`;
    }
  }
  $("#exCancel").onclick = () => { if (exporting) { exporting.cancel = true; exporting.done && exporting.done(); } };
  $("#delP").onclick = async e => {
    const b = e.currentTarget;
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "แตะอีกครั้งเพื่อยืนยันลบ (กู้คืนไม่ได้)"; return; }
    await DB.del(id); delete tempVideos[id]; toast("ลบโปรเจกต์แล้ว"); setView(viewHome);
  };

  await ensureFont(p.style);
  await loadMediaEls(p, pvMedia);
  syncStyleUI(); syncAudio(); syncLang(); syncFrame(); syncSplitUI();
  buildStage(); renderList(); renderLib(); renderSfx(); syncExportHint(); hookMedia();
  cleanup = () => {
    cancelAnimationFrame(raf); stopFx(); stopLive(); clearTimeout(saveT); if (histT) clearTimeout(histT); DB.put(p);
    window.removeEventListener("resize", onResize); document.removeEventListener("fullscreenchange", onFsChange); document.removeEventListener("keydown", onKey);
    document.documentElement.style.overflow = ""; if (url) URL.revokeObjectURL(url); freeMedia(pvMedia);
  };
}

/* ---------- Settings ---------- */
const HELP = {
  groq: `<ol>
      <li>เข้า <b>console.groq.com</b> แล้วกด Sign in ด้วยบัญชี Google (ไม่ต้องใช้บัตร)</li>
      <li>กดเมนู <b>API Keys</b> แล้วกด <b>Create API Key</b> ตั้งชื่อว่า ซับไว</li>
      <li>คัดลอก key ที่ขึ้นต้นด้วย gsk_ (แสดงครั้งเดียว)</li>
      <li>วาง key ในช่องด้านบน แล้วกด ทดสอบ key และ บันทึก</li></ol>
      <span class="hint">โควตาฟรีถอดเสียงได้ประมาณวันละ 8 ชั่วโมงของคลิป เกินพอสำหรับใช้งานทั่วไป</span>`,
  openai: `<ol>
      <li>เข้า <b>platform.openai.com</b> แล้วเข้าสู่ระบบ</li>
      <li>Settings → Billing เติมเครดิตขั้นต่ำ $5 (ต้องใช้บัตรที่เปิดใช้จ่ายออนไลน์ต่างประเทศ)</li>
      <li>API keys → Create new secret key แล้วคัดลอก</li>
      <li>วาง key ในช่องด้านบน แล้วกด บันทึก</li></ol>
      <span class="hint">ค่าถอดเสียงประมาณ $0.006 ต่อนาที</span>`
};
function openSettings() {
  const root = $("#modalRoot");
  let pv = settings.provider;
  const draft = { groqKey: settings.groqKey, apiKey: settings.apiKey };
  root.innerHTML = `<div class="modal" id="mdl"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stt">
    <h2 id="stt">ตั้งค่า AI</h2>
    <div class="field"><span class="lab">ผู้ให้บริการ AI</span>
      <div class="seg" id="pvSeg">${Object.entries(PROVIDERS).map(([k, v]) => `<button type="button" data-v="${k}">${v.n} · ${v.tag}</button>`).join("")}</div></div>
    <div class="field"><label for="kIn" id="kLab"></label>
      <div class="row"><input class="input" id="kIn" type="password" autocomplete="off"><button class="btn small" id="kShow">แสดง</button></div>
      <span class="hint" id="kNote"></span>
      <span class="hint" id="kStat"></span></div>
    <details class="box" id="helpBox"><summary>ยังไม่มี key? วิธีสมัคร</summary><div class="in" id="help"></div></details>
    <div class="row"><button class="btn" id="kTest">ทดสอบ key</button><button class="btn primary" id="kSave" style="margin-left:auto">บันทึก</button><button class="btn" id="kClose">ปิด</button></div>
  </div></div>`;
  const paint = () => {
    const P = PROVIDERS[pv];
    $$("#pvSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === pv));
    $("#kLab").textContent = `${P.n} API key`; $("#kIn").placeholder = P.ph; $("#kIn").value = draft[P.keyField] || "";
    $("#kNote").textContent = `key เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น และส่งตรงไปที่ ${P.n} ตอนถอดเสียงและแปลภาษา`;
    $("#help").innerHTML = HELP[pv]; $("#helpBox").open = !draft[P.keyField];
    $("#kStat").textContent = "";
  };
  $("#kIn").oninput = e => { draft[PROVIDERS[pv].keyField] = e.target.value.trim(); };
  $$("#pvSeg button").forEach(b => b.onclick = () => { pv = b.dataset.v; paint(); });
  paint();
  const close = () => { root.innerHTML = ""; };
  $("#mdl").onclick = e => { if (e.target.id === "mdl") close(); };
  $("#kClose").onclick = close;
  $("#kShow").onclick = () => { const i = $("#kIn"); i.type = i.type === "password" ? "text" : "password"; $("#kShow").textContent = i.type === "password" ? "แสดง" : "ซ่อน"; };
  $("#kSave").onclick = () => {
    settings.provider = pv; settings.groqKey = draft.groqKey || ""; settings.apiKey = draft.apiKey || ""; saveSettings(); close();
    toast(hasKey() ? `บันทึกแล้ว ใช้ ${prov().n}` : "บันทึกแล้ว แต่ยังไม่ได้ใส่ key");
    if ($(".home-head")) viewHome(); else { const g = $("#go"); if (g && !g.disabled) g.textContent = hasKey() ? "เริ่มสร้างซับ" : "ใส่ API key แล้วเริ่มสร้างซับ"; }
  };
  $("#kTest").onclick = async () => {
    const P = PROVIDERS[pv], k = $("#kIn").value.trim(), s = $("#kStat");
    if (!k) { s.textContent = "ยังไม่ได้ใส่ key"; s.style.color = "var(--danger)"; return; }
    s.textContent = "กำลังทดสอบ…"; s.style.color = "";
    try {
      const r = await fetch(P.base + "/models", { headers: { Authorization: "Bearer " + k } });
      s.textContent = r.ok ? "✓ key ใช้งานได้" : r.status === 401 ? "✗ key ไม่ถูกต้อง ลองคัดลอกใหม่อีกครั้ง" : `✗ ${P.n} ตอบกลับ ${r.status}`;
      s.style.color = r.ok ? "var(--ok)" : "var(--danger)";
    } catch { s.textContent = `✗ เชื่อมต่อ ${P.n} ไม่ได้ ตรวจอินเทอร์เน็ต`; s.style.color = "var(--danger)"; }
  };
}

/* ================= boot ================= */
$("#goHome").onclick = () => setView(viewHome);

DB.open().then(() => setView(viewHome)).catch(() => { app.innerHTML = `<div class="empty"><b>เบราว์เซอร์นี้เปิดที่เก็บข้อมูลไม่ได้</b><span class="muted">ถ้าเปิดในโหมดไม่ระบุตัวตน ให้เปิดหน้าต่างปกติแทน</span></div>`; });

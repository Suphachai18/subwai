<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>ซับไว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Prompt:wght@500;700;800&family=Mitr:wght@500;600&family=Sarabun:wght@500;700;800&family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Bai+Jamjuree:wght@500;700&family=K2D:wght@500;700;800&family=Krub:wght@500;700&family=Athiti:wght@500;700&family=Niramit:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Sriracha&family=Mali:wght@500;700&family=Pattaya&family=Chonburi&family=Kodchasan:wght@500;700&family=Fahkwang:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Charmonman:wght@400;700&family=Srisakdi:wght@400;700&family=Pridi:wght@500;700&family=Trirong:wght@500;700;800&family=Taviraj:wght@500;700;800&family=Noto+Serif+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column of projects; editor = sticky video stage + tabbed side panel on wide screens */
:root{
  --bg:#0D1117; --surface:#151B24; --raise:#1C2430; --line:#2A3341;
  --fg:#E8ECF2; --muted:#8B95A6;
  --accent:#F4C430; --on-accent:#1B1503; --accent-text:#F4C430;
  --danger:#F0605A; --ok:#43C08A;
  --ui:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#F3F5F8; --surface:#FFFFFF; --raise:#ECEFF4; --line:#D9DEE6; --fg:#121821; --muted:#5A6473; --accent-text:#866200; --danger:#C93A34; --ok:#1F8A5B; color-scheme:light }
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none;overscroll-behavior-y:none;overflow-x:hidden}
/* the page scrolls normally (works in Safari, Chrome and in-app browsers); work is autosaved so a refresh never loses it */
#scroller{min-height:100%}
.ver{display:block;margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 calc(48px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--ui);margin:0;text-wrap:balance;line-height:1.25}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.bar{display:flex;align-items:center;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 14px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--ui);font-weight:700;font-size:20px;letter-spacing:.2px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.brand .mark{background:var(--accent);color:var(--on-accent);font-size:13px;padding:3px 7px;border-radius:4px;line-height:1.2}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--ui);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{display:grid;gap:6px}
.field>label,.lab{font-family:var(--ui);font-weight:600;font-size:14px}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.input{min-height:72px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}

.home-head{display:flex;flex-wrap:wrap;align-items:end;gap:12px;justify-content:space-between;margin-bottom:18px}
.home-head h1{font-size:30px}
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,var(--surface));margin-bottom:18px}
.notice p{margin:0;flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pwrap{position:relative} .pdel{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center} .pcard{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;padding:0}
.pcard:hover{border-color:var(--muted)}
.thumb{aspect-ratio:16/10;background:var(--raise);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:2px 6px;border-radius:4px}
.pcard .meta{padding:12px 14px;display:grid;gap:4px;min-width:0}
.pcard .meta b{font-family:var(--ui);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty .sample{font-family:"Kanit",var(--ui);font-weight:700;font-size:22px;color:#fff;background:#000;padding:6px 14px;border-radius:6px;line-height:1.35}
.empty .sample small{display:block;font-size:15px;color:#FFE14D;font-weight:500}

.np{max-width:640px;display:grid;gap:20px}
/* never let long names push the page wider than the phone */
.wrap,.np,.field,.pane,.panel,.ed-grid,.stage-col,.home-head,.grid,.drafts,.dcard,.xbox,.row,.chips{min-width:0}
.np,.field,.pane{grid-template-columns:minmax(0,1fr)}
.wrap{overflow-wrap:anywhere}
.np>*,.field>*,.pane>*{max-width:100%}
input.input,select.input,textarea.input{max-width:100%}
/* iPhone zooms in when a text box under 16px gets focus: keep them at 16px on touch screens */
@media (pointer:coarse){ .input,select,textarea:not(.ovedit),input[type=text],input[type=search],input:not([type]){font-size:16px} }
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-family:var(--ui);display:inline-flex;gap:6px;align-items:center;justify-self:start}
.np h1{font-size:30px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 18px;text-align:center;display:grid;gap:10px;justify-items:center;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--accent)}
.drop .up{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.fileinfo{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.fileinfo img{width:80px;height:56px;object-fit:cover;border-radius:6px;background:var(--raise)}
.fileinfo div{min-width:0;flex:1} .fileinfo .col-btns{flex:0 0 auto;display:grid;gap:6px}
.clips{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)} .clips ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.clips li{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px solid var(--line)} .clips .cnum{width:22px;text-align:center;color:var(--muted)} .clips .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:grid}
.clips .row{gap:8px;justify-content:space-between} .jbar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden} .jbar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}
#fsave{display:block;margin-top:2px}
.fileinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:42px;border:0;background:none;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.steps{list-style:none;margin:0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:center}
.steps .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.doing .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done .dot{background:var(--ok);border-color:var(--ok)}
.steps li.fail .dot{background:var(--danger);border-color:var(--danger)}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--danger);font-size:14px;white-space:pre-wrap}

.ed-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ed-top .name{flex:1;min-width:180px;font-family:var(--ui);font-weight:700;font-size:20px;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px}
.ed-top .name:hover,.ed-top .name:focus{border-color:var(--line);background:var(--surface)}
.saved{font-size:12px;color:var(--muted)}
.ed-grid{display:grid;gap:18px}
@media (min-width:900px){ .ed-grid{grid-template-columns:minmax(0,1fr) minmax(0,460px);align-items:start} .stage-col{position:sticky;top:84px} }
.stage-col{display:grid;gap:10px;justify-items:center;min-width:0}
@media (max-width:899px){ .stage-col{position:sticky;top:69px;z-index:4;background:var(--bg);padding-block:6px 10px;border-bottom:1px solid var(--line)} }
.qe{width:100%;max-width:640px;display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px}
.qe-bar{display:flex;align-items:center;gap:6px}
.qe-bar .mono{margin-left:auto;margin-right:auto;font-size:12.5px}
.qbtn{min-width:40px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px;padding:0 10px}
.qbtn.play{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.qe textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:none;padding:6px 8px;font-family:var(--ui);font-size:16px;line-height:1.4}
.qe textarea.tr{font-size:14.5px;color:var(--accent-text)}
.qe-acts{display:flex;flex-wrap:wrap;gap:2px}
.npprev{display:block;margin:0 auto;border-radius:10px;background:#3A4150;max-width:100%;max-height:46vh}
.np-looks{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:104px;overflow-x:auto;padding-bottom:4px}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;max-width:100%}
.stage video{display:block;width:100%;height:100%;object-fit:contain}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.missing{display:grid;gap:10px;justify-items:center;padding:30px 16px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);width:100%}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:48px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--ui);font-weight:600;color:var(--muted);font-size:14px;padding:0 4px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:14px;display:grid;gap:14px}
.subseg{margin:12px 14px 0}
.claudebox{display:grid;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:12px} .claudebox .row{flex-wrap:wrap} .pkmore summary{cursor:pointer;padding:4px 0} .pkmore .row{margin-top:6px}
#pkModal textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:12px}
.chk{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px} .chk li{display:grid} .chk li.ok .hint{color:var(--ok)} .chk li.bad .hint{color:var(--danger)} .chk li.warn .hint{color:var(--accent-text)}
.cloudchip{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--ui);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.cloudchip.ok{color:var(--ok)} .cloudchip.warn{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--surface))} .cloudchip.busy{color:var(--muted)}
.aibar{display:grid;gap:10px;padding:12px;border:1px solid var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.cutbox{display:grid;gap:8px;margin-bottom:12px} .fxrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:6px} .fxrow select{width:auto;min-width:0;max-width:44vw} .fxrow .btn{white-space:normal;line-height:1.25} .mini.fxchip{color:var(--fg);background:var(--raise);border-radius:999px;margin:2px 4px 0 0;text-align:left} .ln .mini[data-cutline]{opacity:.55} .cutbox .row{flex-wrap:wrap;gap:8px} .ln.cut .ln-in{opacity:.45;text-decoration:line-through} .ln.cut .ln-t::after{content:" ✂";} .aibar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.aibar,.aibar>*{min-width:0;max-width:100%}
.aibar .btn{white-space:normal;text-align:center;line-height:1.3;padding-block:8px}
.ls-acts{flex-wrap:wrap}
.ls-acts .chip2{white-space:normal}
.drafts{display:grid;gap:10px;margin:0 0 18px}
.dcard{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card,transparent)}
.dcard img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#0003;flex:none}
.dcard .meta{flex:1;min-width:0;display:grid}
.dcard .meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savedok{color:var(--ok)}
.tools{display:grid;gap:10px}
details.box{border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.box summary{min-height:42px;display:flex;align-items:center;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px}
details.box .in{display:grid;gap:8px;padding-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.input{flex:1;min-width:120px}
.caps{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
@media (max-width:899px){.caps{max-height:none}}
.cap{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:4px;background:var(--bg)}
.cap.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cap-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc{border:0;background:var(--raise);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12.5px}
.cap textarea{width:100%;border:0;background:none;resize:none;padding:2px 0;min-height:28px;font-family:var(--ui);font-size:16px;line-height:1.45;overflow:hidden}
.cap textarea.tr{font-size:14.5px;color:var(--accent-text);border-top:1px dashed var(--line);padding-top:5px}
.cap textarea:focus{outline:none}
.cap-acts{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.mini{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 6px;border-radius:6px;cursor:pointer;font-family:var(--ui)}
.mini:hover{background:var(--raise);color:var(--fg)}
.mini.del:hover{color:var(--danger)}
.times{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.times input,.sfxrow input.t{width:96px;min-height:34px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:13px}
.sfxtag{font-size:11.5px;background:var(--raise);border-radius:99px;padding:1px 8px;color:var(--muted)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;min-height:42px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14px;color:var(--muted)}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.badge{font-size:11px;background:var(--raise);color:var(--fg);border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:600}
.lookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.look{display:grid;gap:4px;padding:5px 5px 7px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;text-align:center;font-family:var(--ui);font-weight:600;font-size:12.5px;min-width:0}
.look canvas{width:100%;aspect-ratio:8/5;border-radius:8px;display:block;background:#3A4150}
.look span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.mycard{display:grid;gap:2px;min-width:0}
.mycard .mini{justify-self:center}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.fontbtn{display:grid;gap:2px;justify-items:center;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;min-width:0}
.fontbtn b{font-size:20px;line-height:1.35;font-weight:inherit}
.fontbtn span{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fontbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.fx{display:grid;gap:4px;padding:4px 4px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:center;font-family:var(--ui);font-weight:600;font-size:12.5px}
.fx canvas{width:100%;aspect-ratio:16/9;border-radius:6px;display:block;background:#222831}
.fx[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.preset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px;min-height:40px}
.ctl{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center}
.ctl label{font-size:14px;font-family:var(--ui);font-weight:600}
.ctl output{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:40px;text-align:right}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.prog{height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.result video{width:100%;max-height:50vh;border-radius:10px;background:#000}
.divider{height:1px;background:var(--line)}

<script>
/* Some iPhone Safari builds misplace text drawn with textAlign "center"/"right" on canvas (Thai text lands half a line to the right).
   Measure and place it ourselves; the result is identical everywhere else. */
(() => { const P = CanvasRenderingContext2D.prototype;
  for (const fnName of ["fillText", "strokeText"]) { const orig = P[fnName];
    P[fnName] = function (txt, x, y, mw) { const al = this.textAlign;
      if (al === "center" || al === "right" || al === "end") { const w = Math.min(this.measureText(txt).width, mw === undefined ? Infinity : mw); this.textAlign = "left"; try { const dx = al === "center" ? w / 2 : w; return mw === undefined ? orig.call(this, txt, x - dx, y) : orig.call(this, txt, x - dx, y, mw); } finally { this.textAlign = al; } }
      return mw === undefined ? orig.call(this, txt, x, y) : orig.call(this, txt, x, y, mw); }; }
  /* iPhone Safari ignores globalAlpha on anything drawn with a shadow, so fading graphics left solid pieces behind
     (they "stuck" and flashed at scene changes). While something is fading, draw it without its shadow. */
  for (const fnName of ["fill", "stroke", "fillText", "strokeText", "drawImage", "fillRect", "strokeRect"]) { const orig = P[fnName];
    P[fnName] = function (...a) { if (this.globalAlpha < 0.999 && this.shadowColor !== "rgba(0, 0, 0, 0)" && (this.shadowBlur > 0 || this.shadowOffsetX || this.shadowOffsetY)) { const c = this.shadowColor; this.shadowColor = "rgba(0,0,0,0)"; try { return orig.apply(this, a); } finally { this.shadowColor = c; } } return orig.apply(this, a); }; } })();

"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const once = (el, ev) => new Promise(r => el.addEventListener(ev, r, { once: true }));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n, l = 2) => String(n).padStart(l, "0");
function fmtT(t) { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return pad(m) + ":" + s.toFixed(1).padStart(4, "0"); }
function fmtDur(t) { t = Math.round(t || 0); return Math.floor(t / 60) + ":" + pad(t % 60); }
function parseT(str) {
  str = String(str).trim().replace(",", ".");
  if (!str) return NaN;
  const p = str.split(":").map(Number);
  if (p.some(isNaN)) return NaN;
  return p.reduce((a, b) => a * 60 + b, 0);
}
function fmtSize(b) { return b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB"; }
function toast(msg, ms = 2600) {

  setTimeout(() => t.remove(), ms);
}
function downloadBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);

async function shareOrSave(blob, name) {
  try {
    const f = new File([blob], name, { type: blob.type });

  downloadBlob(blob, name);

/* one file that carries a whole project (video, photos, own sounds, graphics) to another browser or device */
const BUNDLE_MAGIC = "SUBWAI-BUNDLE1\n";
async function makeBundle(p) {
  const parts = [], blobs = [];
  const add = (meta, blob) => { if (!blob) return; parts.push({ ...meta, size: blob.size, type: blob.type || "" }); blobs.push(blob); };
  add({ t: "video", id: p.id }, await DB.getVideo(p.id).catch(() => null));
  const mids = new Set();
  for (const sc of (p.split && p.split.scenes) || []) { if (sc.media && sc.media.id) mids.add(sc.media.id); if (sc.photo && sc.photo.id) mids.add(sc.photo.id); }
  for (const id of mids) { const r = await DB.mediaGet(id).catch(() => null); if (r) add({ t: "media", id, kind: r.kind, name: r.name || "" }, r.blob); }
  for (const x of p.sfx || []) { if (!String(x.key).startsWith("c:")) continue; const c = customLib.find(c => "c:" + c.id === x.key); if (c && !parts.some(q => q.t === "sfx" && q.id === c.id)) add({ t: "sfx", id: c.id, name: c.name }, c.blob); }
  const head = JSON.stringify({ v: 1, project: p, parts }), hb = new Blob([head]);
  return new Blob([BUNDLE_MAGIC, String(hb.size).padStart(12, "0"), hb, ...blobs], { type: "application/octet-stream" });
}
async function readBundle(file) {
  const m = await file.slice(0, BUNDLE_MAGIC.length + 12).text();
  if (!m.startsWith(BUNDLE_MAGIC)) throw new Error("ไฟล์นี้ไม่ใช่ไฟล์งานของซับไว");
  const hl = parseInt(m.slice(BUNDLE_MAGIC.length), 10), o0 = BUNDLE_MAGIC.length + 12;
  const head = JSON.parse(await file.slice(o0, o0 + hl).text()); let o = o0 + hl;
  const p = head.project; if (!p || !p.id) throw new Error("ไฟล์งานเสียหาย");
  for (const q of head.parts || []) {
    const b = file.slice(o, o + q.size, q.type); o += q.size;

        const r = await fetch(loc, { method: "PUT", headers: { "Content-Range": `bytes */${size}` } });
        if (r.ok) { try { localStorage.removeItem(sk); } catch {} return (await r.json()).id; }
        const rg = r.status === 308 && r.headers.get("Range");
        if (r.status === 308) off = rg ? +rg.split("-")[1] + 1 : 0; else loc = null;
      } catch { loc = null; }
    }
    if (!loc) {
      const init = await this.api(`${UPL}?uploadType=resumable&fields=id`, { method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": blob.type || "application/octet-stream", "X-Upload-Content-Length": String(size) }, body: JSON.stringify({ name, parents: [await this.root()], appProperties: props }) });
      if (!init.ok) throw new Error(`เริ่มอัปโหลดไม่ได้ (${init.status})`);
      loc = init.headers.get("Location"); if (!loc) throw new Error("Google Drive ไม่ตอบที่อยู่สำหรับอัปโหลด");
      off = 0; try { localStorage.setItem(sk, JSON.stringify({ loc, size, t: Date.now() })); } catch {}
    }
    while (true) {
      const end = Math.min(size, off + CH); let r = null;
      for (let a = 0; a < 5 && !r; a++) {
        try { r = await fetch(loc, { method: "PUT", headers: { "Content-Range": size ? `bytes ${off}-${end - 1}/${size}` : "bytes */0" }, body: blob.slice(off, end) }); }
        catch { await sleep(2000 * (a + 1)); }
      }
      if (!r) throw new Error("อินเทอร์เน็ตหลุดระหว่างอัปโหลด จะลองต่อให้อัตโนมัติ");
      if (r.ok) { try { localStorage.removeItem(sk); } catch {} if (onProg) onProg(1); return (await r.json()).id; }
      if (r.status !== 308) { if (r.status === 404 || r.status === 410) try { localStorage.removeItem(sk); } catch {} throw new Error(`อัปโหลดไม่สำเร็จ (${r.status})`); }
      const rg = r.headers.get("Range"); off = rg ? +rg.split("-")[1] + 1 : end;
      if (onProg) onProg(off / Math.max(1, size));
    }
  },
  async download(id, onProg) {
    const r = await this.api(`${DRV}/${id}?alt=media`);
    if (!r.ok) throw new Error(`ดาวน์โหลดจาก Google Drive ไม่ได้ (${r.status})`);
    const total = +r.headers.get("Content-Length") || 0, type = r.headers.get("Content-Type") || "application/octet-stream";
    if (!r.body || !r.body.getReader) return r.blob();
    const rd = r.body.getReader(); let parts = [], acc = [], accN = 0, got = 0;
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      acc.push(value); accN += value.length; got += value.length;
      if (accN > 32 * 1024 * 1024) { parts.push(new Blob(acc)); acc = []; accN = 0; } // let the browser keep finished parts on disk
      if (onProg && total) onProg(got / total);
    }
    if (acc.length) parts.push(new Blob(acc));
    return new Blob(parts, { type });
  },
  trash(id) { if (id) return this.api(`${DRV}/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true }) }).catch(() => {}); },

  /* ---- projects ---- */
  schedule(p) {
    if (!this.enabled() || !p || p.draft) return;
    this.queue.add(p.id); clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 2500);
  },
  async flush() {
    if (this.flushing || !this.enabled()) return;
    if (!this.valid()) { this.setState("auth"); return; }
    this.flushing = true; this.paint();
    try {
      for (const id of [...this.queue]) { this.queue.delete(id); const p = await DB.get(id); if (p && !p.draft) await this.pushProject(p); }
      this.setState("ok");
    } catch (e) { if (e.message !== "AUTH") this.setState("err", e.message); }
    finally { this.flushing = false; this.paint(); if (this.queue.size && this.valid()) this.timer = setTimeout(() => this.flush(), 4000); }
  },
  async pushProject(p) {
    const c = { ...this.meta(p.id) }; c.media = { ...(c.media || {}) };
    for (const sc of (p.split && p.split.scenes) || []) for (const m of [sc.media, sc.photo && { id: sc.photo.id }]) {
      if (!m || !m.id || c.media[m.id]) continue;
      const rec = await DB.mediaGet(m.id).catch(() => null); if (!rec || !rec.blob) continue;
      const have = await this.find({ subwai: "media", mid: m.id });
      c.media[m.id] = have[0] ? have[0].id : await this.upload(rec.blob, `media-${m.id}`, { subwai: "media", mid: m.id }, null, "m" + m.id);
    }
    const data = { ...p, cloud: { videoId: c.videoId || "", media: c.media } };
    if (c.pushedU && c.pushedU >= (p.updatedAt || 0) && c.fileId && !c.dirty) { if (!c.videoId) this.uploadVideo(p.id); return; }
    delete data.videoSaved;
    c.fileId = await this.putJSON(c.fileId, `project-${p.id}.json`, { subwai: "project", pid: p.id, u: String(p.updatedAt || 0) }, data);
    c.pushedU = p.updatedAt || 0; c.dirty = false; this.meta(p.id, c);
    if (!c.videoId) this.uploadVideo(p.id);
  },
  /* one video at a time (phones choke on parallel big uploads) */
  uploadVideo(pid) { this._vq = (this._vq || Promise.resolve()).then(() => this._uploadVideo(pid)).catch(() => {}); return this._vq; },
  async _uploadVideo(pid) {
    if (this.vUp.has(pid) || !this.valid() || this.meta(pid).videoId) return;
    const blob = (await DB.getVideo(pid).catch(() => null)) || tempVideos[pid]; if (!blob) return;
    this.vUp.set(pid, 0); this.paint(); setBusy(true);
    try {
      const have = await this.find({ subwai: "video", pid });
      let id = have.find(f => +f.size === blob.size);
      id = id ? id.id : await this.upload(blob, `video-${pid}.${/quicktime/.test(blob.type) ? "mov" : /webm/.test(blob.type) ? "webm" : "mp4"}`, { subwai: "video", pid }, pr => { this.vUp.set(pid, pr); this.paint(); }, "v" + pid);
      const p = await DB.get(pid);
      this.meta(pid, { videoId: id, dirty: true });
      if (p) { this.queue.add(pid); this.timer = setTimeout(() => this.flush(), 500); }
    } catch (e) { if (e.message !== "AUTH") this.setState("err", "อัปโหลดวิดีโอยังไม่เสร็จ: " + e.message); }
    finally { this.vUp.delete(pid); setBusy(false); this.paint(); }
  },
  async pull(force) {
    if (!this.enabled() || !this.valid()) return 0;
    if (!force && Date.now() - this.pulledAt < 15000) return 0;
    this.pulledAt = Date.now(); this.setState("sync");
    let n = 0;
    try {
      const files = await this.find({ subwai: "project" });
      const locals = new Map((await DB.all()).map(p => [p.id, p]));
      const seen = new Set();
      for (const f of files.sort((a, b) => (+b.appProperties.u || 0) - (+a.appProperties.u || 0))) {
        const pid = f.appProperties && f.appProperties.pid; if (!pid || seen.has(pid)) continue; seen.add(pid);
        const lp = locals.get(pid), u = +f.appProperties.u || 0;
        if (lp && !lp.draft && (lp.updatedAt || 0) >= u) { if (this.meta(pid).fileId !== f.id) this.meta(pid, { fileId: f.id }); if ((lp.updatedAt || 0) > u) this.queue.add(pid); continue; }
        const data = await this.getJSON(f.id);
        if (!data || !data.id) continue;
        this.meta(pid, { fileId: f.id, videoId: (data.cloud && data.cloud.videoId) || this.meta(pid).videoId || "", media: (data.cloud && data.cloud.media) || {}, pushedU: u, dirty: false });
        delete data.cloud;
        data.videoSaved = !!(lp && lp.videoSaved);
        await DB.putRaw(data); n++;
      }
      for (const [id, p] of locals) if (!p.draft && !seen.has(id)) this.queue.add(id);
      if (this.queue.size) this.timer = setTimeout(() => this.flush(), 800);
      this.setState("ok");
    } catch (e) { if (e.message !== "AUTH") this.setState("err", e.message); }
    return n;
  },
  async getVideo(p, onProg) {
    let vid = this.meta(p.id).videoId;
    if (!vid) { const f = await this.find({ subwai: "video", pid: p.id }); vid = f[0] && f[0].id; }
    if (!vid) return null;
    this.down.set(p.id, 0); this.paint(); setBusy(true);
    try { return await this.download(vid, pr => { this.down.set(p.id, pr); this.paint(); if (onProg) onProg(pr); }); }
    finally { this.down.delete(p.id); setBusy(false); this.paint(); }
  },
  async getMedia(m, p) {
    if (!this.enabled() || !this.valid() || !m) return null;
    try {
      let fid = p && (this.meta(p.id).media || {})[m.id];
      if (!fid) { const f = await this.find({ subwai: "media", mid: m.id }); fid = f[0] && f[0].id; }
      if (!fid) return null;
      const blob = await this.download(fid); const rec = { id: m.id, blob, kind: m.kind, name: m.name };
      await DB.mediaPut(rec); return rec;
    } catch { return null; }
  },
  /* ---- settings (API keys, chosen AI, vocabulary, default style) ---- */
  SKEYS: ["groqKey", "apiKey", "geminiKey", "pexelsKey", "textAI", "vocab", "style", "lang", "lang2", "maxChars"],
  async pushSettings() {
    if (!this.enabled() || !this.valid()) return;
    try {
      const data = Object.fromEntries(this.SKEYS.map(k => [k, settings[k]]));
      const f = await this.find({ subwai: "settings" });
      await this.putJSON(f[0] && f[0].id, "settings.json", { subwai: "settings" }, data);
    } catch {}
  },
  async pullSettings() {
    try {
      const f = await this.find({ subwai: "settings" }); if (!f[0]) return false;
      const d = await this.getJSON(f[0].id); if (!d) return false;
      for (const k of this.SKEYS) if (d[k] != null && d[k] !== "" && (settings[k] == null || settings[k] === "")) settings[k] = d[k];
      saveSettings(); return true;
    } catch { return false; }
  },
  async start() { // after connecting
    settings.cloudOn = true; saveSettings();
    await this.pullSettings(); await this.pushSettings();
    const n = await this.pull(true);
    this.resumeAll();
    return n;
  },
  /* anything in this browser that is not (fully) in Drive yet: project files first, then videos one by one.
     Runs on every app start too, so an upload that stopped (screen locked, app switched) simply continues. */
  async resumeAll() {
    if (this._resuming || !this.enabled() || !this.valid()) return; this._resuming = true;
    try {
      const all = (await DB.all()).filter(p => !p.draft);
      for (const p of all) if (!this.meta(p.id).fileId) this.queue.add(p.id);
      if (this.queue.size) { clearTimeout(this.timer); await this.flush(); }
      for (const p of all) { const m = this.meta(p.id); if (m.fileId && !m.videoId) await this.uploadVideo(p.id); }
    } catch (e) { console.error(e); } finally { this._resuming = false; this.paint(); }
  }
};

const tempVideos = {};
async function probeVideo(f) {
  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto";
  const url = URL.createObjectURL(f); v.src = url;
  try {
    await Promise.race([once(v, "loadedmetadata"), sleep(15000).then(() => { throw new Error("timeout"); })]);
    const out = { duration: v.duration, width: v.videoWidth, height: v.videoHeight, thumb: "" };
    try {
      v.currentTime = Math.min(1, v.duration / 3);
      await Promise.race([once(v, "seeked"), sleep(5000)]);
      const c = document.createElement("canvas"), k = 360 / Math.max(v.videoWidth, v.videoHeight);
      c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      out.thumb = c.toDataURL("image/jpeg", 0.7);
    } catch {}
    return out;
  } finally { URL.revokeObjectURL(url); v.removeAttribute("src"); }
}

  };
  $("#gCid").oninput = () => { const v = $("#gCid").value.trim(); if (/apps\.googleusercontent\.com$/.test(v)) { settings.gClientId = v; saveSettings(); Cloud.gis().catch(() => {}); } };
  $("#gConn").onclick = () => {
    const v = $("#gCid").value.trim(); if (v) { settings.gClientId = v; saveSettings(); }
    if (!Cloud.cid()) { toast("ใส่ Google Client ID ก่อน"); $("#gBox").open = true; return; }
    const run = () => Cloud.start().then(n => { gPaint(); toast(n ? `เชื่อมแล้ว ดึงงานมา ${n} โปรเจกต์` : "เชื่อม Google Drive แล้ว", 3500); if ($(".home-head")) viewHome(); });
    if (Cloud.valid() && Cloud.enabled()) { run(); return; }
    Cloud.connect().then(() => { $("#gStat").textContent = "กำลังซิงก์…"; return run(); }).catch(e => { toast(e.message, 4500); gPaint(); });
  };
  $("#gOff").onclick = () => { if (!confirm("หยุดซิงก์กับ Google Drive? งานในเครื่องนี้ยังอยู่ครบ และไฟล์ใน Drive ไม่ถูกลบ")) return; Cloud.disconnect(); gPaint(); };
  gPaint();
  $("#sysChk").onclick = async () => {
    settings.groqKey = $("#k_groq").value.trim(); settings.apiKey = $("#k_openai").value.trim(); settings.geminiKey = $("#k_gemini").value.trim(); if (keyOf(PROVIDERS[tai])) settings.textAI = tai; saveSettings();
    const out = $("#chkOut"); out.hidden = false; out.innerHTML = ""; $("#sysChk").disabled = true;
    const row = name => { const li = document.createElement("li"); li.innerHTML = `<b>${name}</b><span class="hint">กำลังตรวจ…</span>`; out.appendChild(li); return (ok, msg) => { li.className = ok === true ? "ok" : ok === false ? "bad" : "warn"; li.lastChild.textContent = (ok === true ? "✓ " : ok === false ? "✗ " : "! ") + msg; }; };
    let r;
    r = row("ถอดเสียง (" + sttProv().n + ")");
    try {
      if (!keyOf(sttProv())) r(false, "ยังไม่ได้ใส่ key");
      else { await whisper(encodeWav(new Float32Array(16000), 16000), { lang: "th" }); r(true, "ส่งเสียงให้ AI ถอดได้ปกติ"); }
    } catch (e) { r(false, e.message); }
    r = row("จัดซับ แก้คำ และแปล (" + chatProv().n + ")");
    try {
      const j = await chatJSON([{ role: "system", content: 'Translate the user text to English. Reply only JSON: {"t": "..."}' }, { role: "user", content: "รถกอล์ฟไฟฟ้าราคาดี" }], { maxTok: 400 });
      r(j && j.t ? true : null, j && j.t ? `ตอบได้ปกติ (ทดลองแปล: “${String(j.t).slice(0, 40)}”) · ${settings["chat_" + provKey(chatProv())] || ""}` : "ตอบกลับแต่รูปแบบแปลก ยังใช้ได้");
    } catch (e) { r(false, e.message); }
    r = row("ซิงก์ Google Drive");
    if (!Cloud.cid()) r(null, "ยังไม่ได้ตั้งค่า (ไม่บังคับ) งานเก็บเฉพาะเครื่องนี้");
    else if (!Cloud.enabled()) r(null, "ยังไม่ได้กดเชื่อม");
    else if (!Cloud.valid()) r(null, "ต้องกดเชื่อมอีกครั้ง");
    else { try { await Cloud.root(); r(true, "เชื่อมแล้ว อ่านและเขียน Drive ได้"); } catch (e) { r(false, e.message === "AUTH" ? "ต้องกดเชื่อมอีกครั้ง" : e.message); } }
    r = row("พื้นที่เก็บงานในเครื่อง");
    try { const e = await navigator.storage.estimate(); const free = (e.quota - e.usage) / 1e9; r(free > 3 ? true : null, `ใช้ไป ${(e.usage / 1e9).toFixed(2)} GB · เหลือประมาณ ${free.toFixed(1)} GB${free < 3 ? " (ใกล้เต็ม ลบโปรเจกต์เก่าที่ไม่ใช้)" : ""}`); } catch { r(null, "เบราว์เซอร์นี้ไม่บอกพื้นที่ที่เหลือ"); }
    r = row("สร้างไฟล์วิดีโอ (ส่งออก)");
    const mm = pickMime(); r(mm === null ? false : /mp4/.test(mm) ? true : null, mm === null ? "เบราว์เซอร์นี้สร้างวิดีโอไม่ได้ ใช้ Safari หรือ Chrome รุ่นใหม่" : /mp4/.test(mm) ? "ได้ไฟล์ MP4 ลง TikTok/Reels ได้เลย" : "ได้ไฟล์ WebM (บางแอปอาจต้องแปลงก่อนอัปโหลด)");
    $("#sysChk").disabled = false;
  };
  $("#k_openai").oninput = paint; $("#k_groq").oninput = paint; $("#k_gemini").oninput = paint; paint();
  const close = () => { root.innerHTML = ""; };
  $("#mdl").onclick = e => { if (e.target.id === "mdl") close(); };
  $("#kClose").onclick = close;
  $$("[data-show]").forEach(b => b.onclick = () => { const i = $("#k_" + b.dataset.show); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "แสดง" : "ซ่อน"; });
  $$("[data-test]").forEach(b => b.onclick = async () => {
    const k = b.dataset.test, P = PROVIDERS[k], key = $("#k_" + k).value.trim(), s = $("#st_" + k);
    if (!key) { s.textContent = "ยังไม่ได้ใส่ key"; s.style.color = "var(--danger)"; return; }
    s.textContent = "กำลังทดสอบ…"; s.style.color = "";
    try {
      const r = await fetch(P.base + "/models", { headers: { Authorization: "Bearer " + key } });
      s.textContent = r.ok ? "✓ key ใช้งานได้" : r.status === 401 ? "✗ key ไม่ถูกต้อง ลองคัดลอกใหม่อีกครั้ง" : `✗ ${P.n} ตอบกลับ ${r.status}`;
      s.style.color = r.ok ? "var(--ok)" : "var(--danger)";
    } catch { s.textContent = `✗ เชื่อมต่อ ${P.n} ไม่ได้ ตรวจอินเทอร์เน็ต`; s.style.color = "var(--danger)"; }
  });
  $("#kSave").onclick = () => {
    settings.groqKey = $("#k_groq").value.trim(); settings.apiKey = $("#k_openai").value.trim(); settings.geminiKey = $("#k_gemini").value.trim(); settings.pexelsKey = $("#k_pexels").value.trim();
    if (!keyOf(PROVIDERS[tai])) { toast(`ใส่ ${PROVIDERS[tai].n} API key ก่อน หรือเลือก AI ตัวอื่น`); return; }
    if (!settings.groqKey && !settings.apiKey) { toast("ต้องมี Groq API key สำหรับถอดเสียง (ฟรี)"); return; }
    if (settings.textAI !== tai) { delete settings.chat_openai; delete settings.chat_gemini; }
    settings.textAI = tai; settings.provider = settings.groqKey ? "groq" : "openai"; saveSettings(); close(); Cloud.pushSettings();
    toast(!hasKey() ? "บันทึกแล้ว แต่ยังไม่ได้ใส่ key" : `บันทึกแล้ว · ถอดเสียง: ${sttProv().n} · จัดซับ/แปล: ${chatProv().n}`, 3500);
    if ($(".home-head")) viewHome(); else { const g = $("#go"); if (g && !g.disabled) g.textContent = hasKey() ? "เริ่มสร้างซับ" : "ใส่ API key แล้วเริ่มสร้างซับ"; }
  };
}

/* ================= boot ================= */
$("#goHome").onclick = () => { if (BUSY) { toast("กำลังทำงานอยู่ รอให้เสร็จก่อน"); return; } setView(viewHome); };
$("#openSettings").onclick = openSettings;
$("#cloudChip").onclick = () => {
  if (Cloud.state === "auth" || !Cloud.valid()) { Cloud.connect().then(() => { Cloud.resumeAll(); return Cloud.pull(true); }).then(n => { toast(n ? `ซิงก์แล้ว ดึงงานมา ${n} โปรเจกต์` : "ซิงก์แล้ว"); if ($(".home-head")) viewHome(); }).catch(e => toast(e.message, 4000)); return; }
  if (Cloud.state === "err") { toast(Cloud.msg || "ซิงก์ไม่สำเร็จ", 4000); }
  Cloud.pull(true).then(n => { if (n && $(".home-head")) viewHome(); }); Cloud.flush(); Cloud.resumeAll();
};
Cloud.init();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
/* crash guard: if the last visit ended without a normal close (iPhone ran out of memory and killed the page),
   start on the home screen instead of reopening the same heavy screen again and again */
let lastClean = true;
try { lastClean = localStorage.getItem("subwai.clean") !== "0"; localStorage.setItem("subwai.clean", "0"); } catch {}
const markClean = () => { try { localStorage.setItem("subwai.clean", "1"); } catch {} };
window.addEventListener("pagehide", markClean);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") markClean(); else { try { localStorage.setItem("subwai.clean", "0"); } catch {} } });
DB.open().then(async () => {
  const h = location.hash.slice(1), m = /^([pn])=(.+)$/.exec(h);
  if (m && lastClean) { const p = await DB.get(m[2]).catch(() => null); if (p) { setView(p.draft ? () => viewNew(p.id) : () => viewEditor(p.id)); return; } }
  await viewHome();
  if (m && !lastClean) toast("หน้าเว็บถูกปิดกลางคัน (มือถือหน่วยความจำไม่พอ) งานที่ทำไว้ยังอยู่ กด “ทำต่อ” หรือเปิดโปรเจกต์ได้เลย", 6000);
}).catch(() => { app.innerHTML = `<div class="empty"><b>เบราว์เซอร์นี้เปิดที่เก็บข้อมูลไม่ได้</b><span class="muted">ถ้าเปิดในโหมดไม่ระบุตัวตน ให้เปิดหน้าต่างปกติแทน</span></div>`; });
</script>
</body>
</html>
